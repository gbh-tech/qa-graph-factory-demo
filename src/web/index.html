<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TestPulse — Quality Dashboard</title>
  <style>
    /* ── Design tokens ─────────────────────────────────────────────── */
    :root {
      --gbh-navy:    #062F6E;
      --gbh-deep:    #131F48;
      --gbh-green:   #00AE41;
      --gbh-blue:    #04A6E1;
      --gbh-ink:     #231F20;
      --gbh-muted:   #636466;
      --gbh-line:    #D5D7D8;
      --gbh-gradient: linear-gradient(90deg, #00AE41 0%, #04A6E1 100%);
      --canvas:      #F4F5F6;
      --surface:     #FFFFFF;
      --radius-lg:   18px;
      --radius-md:   10px;
      --radius-sm:   6px;
    }

    /* ── Reset / base ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--canvas);
      color: var(--gbh-ink);
      font-size: 16px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Skip link ──────────────────────────────────────────────────── */
    .skip-link {
      position: absolute;
      top: -100%;
      left: 16px;
      background: var(--gbh-navy);
      color: #fff;
      padding: 8px 16px;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      z-index: 999;
    }
    .skip-link:focus { top: 0; }

    /* ── Page shell ─────────────────────────────────────────────────── */
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 16px 24px;
    }

    /* ── Header ─────────────────────────────────────────────────────── */
    header {
      background: var(--gbh-navy);
      color: #fff;
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
      margin-bottom: 32px;
    }
    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 0;
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }
    .logo {
      /* approved GBH master asset (white variant on navy); aspect ratio preserved, never < 57px wide */
      height: 48px;
      width: auto;
      flex-shrink: 0;
      margin-right: 24px; /* clear space */
    }
    .wordmark { flex: 1; }
    .wordmark-eyebrow {
      font-size: clamp(9px, 1.2vw, 11px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
      margin-bottom: 2px;
    }
    .wordmark-name {
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .hero-status {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 16px 20px;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }
    .sig-bar {
      height: 5px;
      background: var(--gbh-gradient);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }

    /* ── Section titles ─────────────────────────────────────────────── */
    .section { margin-bottom: 40px; }
    .section-title {
      font-size: clamp(13px, 1.8vw, 15px);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--gbh-muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    /* ── KPI grid ───────────────────────────────────────────────────── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 820px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 480px) {
      .kpi-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-md);
      padding: 20px 24px;
    }
    .kpi-number {
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--gbh-navy);
      line-height: 1;
      margin-bottom: 6px;
    }
    .kpi-number.pass  { color: var(--gbh-green); }
    .kpi-number.risk  { color: #C0392B; }
    .kpi-label {
      font-size: 13px;
      color: var(--gbh-muted);
      font-weight: 500;
    }

    /* ── Chart ──────────────────────────────────────────────────────── */
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-md);
      padding: 24px;
      overflow: hidden;
    }
    .chart-card svg {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── Tables ─────────────────────────────────────────────────────── */
    .table-wrapper {
      background: var(--surface);
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-md);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    table caption {
      text-align: left;
      padding: 14px 16px 10px;
      font-size: 13px;
      color: var(--gbh-muted);
      font-weight: 500;
      caption-side: top;
    }
    thead th {
      background: var(--gbh-navy);
      color: #fff;
      padding: 10px 14px;
      text-align: left;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      font-weight: 600;
    }
    thead th.num { text-align: right; }
    tbody tr { border-bottom: 1px solid var(--gbh-line); }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #F8F9FA; }
    tbody td {
      padding: 10px 14px;
      color: var(--gbh-ink);
      white-space: nowrap;
    }
    tbody td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    /* ── Status badges ──────────────────────────────────────────────── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 100px;
      border: 1px solid currentColor;
    }
    .badge.pass   { color: var(--gbh-green); background: #E8F8EE; }
    .badge.fail   { color: #C0392B;          background: #FDE8E6; }
    .badge.skip   { color: var(--gbh-muted); background: #F2F2F2; }
    .badge.error  { color: #8B2000;          background: #FDE8E6; }

    /* ── Run link ───────────────────────────────────────────────────── */
    .run-link {
      background: none; border: none; padding: 0;
      color: var(--gbh-blue);
      cursor: pointer;
      font-size: 14px;
      text-decoration: underline;
      font-family: inherit;
    }
    .run-link:focus-visible {
      outline: 2px solid var(--gbh-blue);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ── Run detail panel ───────────────────────────────────────────── */
    #run-detail {
      background: var(--surface);
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-md);
      padding: 24px;
      display: none;
    }
    #run-detail.visible { display: block; }
    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .detail-title {
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 700;
      color: var(--gbh-navy);
    }
    .close-btn {
      background: none;
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      color: var(--gbh-ink);
    }
    .close-btn:focus-visible {
      outline: 2px solid var(--gbh-navy);
      outline-offset: 2px;
    }
    .results-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
    .result-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .result-name { flex: 1; min-width: 0; word-break: break-word; }
    .result-dur { font-variant-numeric: tabular-nums; color: var(--gbh-muted); font-size: 12px; white-space: nowrap; }

    /* ── Upload form ────────────────────────────────────────────────── */
    .upload-card {
      background: var(--surface);
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-md);
      padding: 24px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 12px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 180px; }
    .form-group label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gbh-ink);
    }
    .form-group input[type="file"],
    .form-group select {
      font-family: inherit;
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid var(--gbh-line);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--gbh-ink);
      min-height: 44px;
    }
    .form-group input[type="file"]:focus,
    .form-group select:focus {
      outline: 2px solid var(--gbh-navy);
      outline-offset: 2px;
    }
    .btn-primary {
      background: var(--gbh-navy);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 10px 24px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      min-height: 44px;
      white-space: nowrap;
      align-self: flex-end;
    }
    .btn-primary:hover { background: var(--gbh-deep); }
    .btn-primary:focus-visible {
      outline: 2px solid var(--gbh-navy);
      outline-offset: 3px;
    }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .upload-msg {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      display: none;
    }
    .upload-msg.success { background: #E8F8EE; color: #1A6B36; border: 1px solid var(--gbh-green); display: block; }
    .upload-msg.error   { background: #FDE8E6; color: #8B2000; border: 1px solid #E74C3C; display: block; }

    /* ── Footer ─────────────────────────────────────────────────────── */
    footer {
      margin-top: 24px;
      padding-top: 0;
      text-align: center;
      font-size: 13px;
      color: var(--gbh-muted);
    }
    .footer-bar {
      height: 4px;
      background: var(--gbh-gradient);
      border-radius: 2px;
      margin-bottom: 16px;
    }

    /* ── Flaky rate bar ─────────────────────────────────────────────── */
    .rate-bar-bg {
      background: var(--gbh-line);
      border-radius: 100px;
      height: 6px;
      width: 80px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
    }
    .rate-bar-fill {
      display: block;
      height: 100%;
      background: #C0392B;
      border-radius: 100px;
    }

    /* ── Loading state ──────────────────────────────────────────────── */
    .loading { color: var(--gbh-muted); font-style: italic; padding: 24px; text-align: center; }

    /* ── Reduced motion ─────────────────────────────────────────────── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner">
    <div class="header-inner">
      <img class="logo" src="/gbh-logo-white.svg" alt="GBH, 20 years">
      <div class="wordmark">
        <p class="wordmark-eyebrow">Quality dashboard</p>
        <h1 class="wordmark-name">TestPulse</h1>
      </div>
    </div>
    <div class="hero-status" id="hero-status" aria-live="polite">Loading…</div>
    <div class="sig-bar" aria-hidden="true"></div>
  </header>

  <main id="main-content" class="page">
    <!-- KPIs -->
    <section class="section" aria-labelledby="kpi-heading">
      <h2 id="kpi-heading" class="section-title">Key measures</h2>
      <div id="kpi-grid" class="kpi-grid" aria-label="Key performance indicators">
        <div class="loading">Loading…</div>
      </div>
    </section>

    <!-- Trend chart -->
    <section class="section" aria-labelledby="trend-heading">
      <h2 id="trend-heading" class="section-title">30-day pass-rate trend</h2>
      <div class="chart-card">
        <div id="trend-chart"><div class="loading">Loading…</div></div>
      </div>
    </section>

    <!-- Flaky tests -->
    <section class="section" aria-labelledby="flaky-heading">
      <h2 id="flaky-heading" class="section-title">Flaky tests</h2>
      <div class="table-wrapper">
        <div id="flaky-table"><div class="loading">Loading…</div></div>
      </div>
    </section>

    <!-- Recent runs -->
    <section class="section" aria-labelledby="runs-heading">
      <h2 id="runs-heading" class="section-title">Recent runs</h2>
      <div class="table-wrapper">
        <div id="runs-table"><div class="loading">Loading…</div></div>
      </div>
    </section>

    <!-- Run detail -->
    <section class="section" aria-labelledby="detail-heading" id="run-detail" aria-label="Run detail">
      <div class="detail-header">
        <h2 id="detail-heading" class="detail-title">Run detail</h2>
        <button class="close-btn" id="close-detail" aria-label="Close run detail">Close</button>
      </div>
      <div id="detail-content"></div>
    </section>

    <!-- Upload -->
    <section class="section" aria-labelledby="upload-heading">
      <h2 id="upload-heading" class="section-title">Upload report</h2>
      <div class="upload-card">
        <form id="upload-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="file-input">Report file</label>
              <input type="file" id="file-input" name="report" accept=".json,.xml" required />
            </div>
            <div class="form-group" style="flex: 0; min-width: 140px;">
              <label for="format-select">Format</label>
              <select id="format-select" name="format">
                <option value="json">JSON</option>
                <option value="junit">JUnit XML</option>
              </select>
            </div>
            <button type="submit" class="btn-primary" id="upload-btn">Upload</button>
          </div>
        </form>
        <div id="upload-msg" class="upload-msg" role="alert" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer role="contentinfo">
    <div class="footer-bar" aria-hidden="true"></div>
    <p>TestPulse &mdash; Quality dashboard &copy; 2026</p>
  </footer>

  <script type="module" src="./main.ts"></script>
</body>
</html>
